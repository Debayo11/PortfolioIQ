spring:
  application:
    name: portfolioiq
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolioiq}
    username: ${DB_USER:portfolioiq}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  market:
    api-key: ${MARKET_DATA_API_KEY:}
    base-url: ${MARKET_DATA_BASE_URL:https://finnhub.io/api/v1}
    cache-ttl-seconds: ${MARKET_CACHE_TTL_SECONDS:60}
    refresh-enabled: ${MARKET_REFRESH_ENABLED:true}
    refresh-interval-ms: ${MARKET_REFRESH_INTERVAL_MS:300000}
    max-requests-per-refresh: ${MARKET_MAX_REQUESTS_PER_REFRESH:50}   # free API tiers allow ~60 calls/minute
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:120}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # The one email address that becomes the first administrator once it is verified. Leave empty after setup.
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}   # comma-separated; empty means same-origin only
  auth:
    # Set true in production so unverified accounts cannot sign in.
    require-verified-email: ${REQUIRE_VERIFIED_EMAIL:false}
  mail:
    from: ${MAIL_FROM:no-reply@portfolioiq.local}
    # DEV ONLY: logs email bodies (including one-time links) when no SMTP server is configured.
    log-only: ${APP_MAIL_LOG_ONLY:false}
# SMTP is enabled by setting SPRING_MAIL_HOST (+ SPRING_MAIL_PORT/USERNAME/PASSWORD) as environment variables.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful                       # finish in-flight requests before stopping
  # Set to "native" behind a reverse proxy so the real client address is used (rate limiting, audit log).
  # Tomcat only trusts the forwarded header from private-network proxies, so it cannot be spoofed from the internet.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"           # every log line carries the request id

springdoc:                                  # set SWAGGER_ENABLED=false in production
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
