server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Use the real client address that the proxy in front (Caddy in production) puts in X-Forwarded-For. Only private
  # networks are trusted to do this, so a client on the internet cannot forge its address.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers. Everything is served from one origin, so the policy can be strict.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # API and docs go to the backend container.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # replaces, never appends, so it cannot be spoofed
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /swagger-ui.html { proxy_pass http://backend:8080; }
  location /swagger-ui/ { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }

  # The service worker and HTML must always be revalidated so updates are picked up.
  location = /index.html { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; try_files $uri =404; }

  # Hashed build assets can be cached for a year.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  # Single-page app: unknown paths load the app, which handles routing.
  location / { try_files $uri $uri/ /index.html; }
}
