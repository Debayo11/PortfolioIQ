name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Migrations match entities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_schema.py

  backend:
    name: Backend (unit and integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # `verify` runs the unit tests and then the *IT tests against real PostgreSQL and Redis (Docker is available on the runner).
      - name: Test
        working-directory: backend
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (types, tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (browser, desktop and phone)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway environment
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env

      - name: Start the full stack
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e.yml logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e.yml down -v
