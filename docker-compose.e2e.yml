# End-to-end test stack: adds a local mail catcher (Mailpit) so tests can read the real verification emails.
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e.yml up -d --build --wait
services:
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"   # web UI and REST API used by the tests
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/livez >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      APP_MAIL_LOG_ONLY: "false"
      BOOTSTRAP_ADMIN_EMAIL: admin@e2e.test
      FRONTEND_URL: http://localhost:3000
      REQUIRE_VERIFIED_EMAIL: "false"
      MARKET_REFRESH_ENABLED: "false"
      RATE_LIMIT_AUTH_PER_MINUTE: "1000"
      RATE_LIMIT_API_PER_MINUTE: "10000"
